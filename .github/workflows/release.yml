name: Release

# Publish a GitHub release with the tag <version>, e.g. 1.0.0, to publish the plugins with that version to the
# Gradle Plugin Portal. Needs the repository secrets GRADLE_PUBLISH_KEY and GRADLE_PUBLISH_SECRET,
# the API key of the Plugin Portal account, see https://plugins.gradle.org/docs/publish-plugin.
"on":
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish, e.g. 1.0.0
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: |
            17
            25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew build --stacktrace
      - name: Publish to the Gradle Plugin Portal
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew publishPlugins --stacktrace -Pversion="${VERSION#v}"
