name: Publish

# Manually (re-)publish a version to the Gradle Plugin Portal, e.g. if the publish job of the Lifecycle workflow failed.
# If only one plugin failed, publish just that one, the Plugin Portal rejects a version that is already published.
"on":
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish, e.g. 1.0.0
        required: true
      ref:
        description: The ref to build, defaults to the tag of the version
        required: false
      plugin:
        description: The plugin to publish
        type: choice
        default: all
        options: [ all, headlessmc-gradle-plugin, headlessmc-dev-plugin ]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.version }}
      - uses: actions/setup-java@v4
        with:
          java-version: |
            17
            25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew build --stacktrace
      - name: Publish to the Gradle Plugin Portal
        env:
          VERSION: ${{ inputs.version }}
          PLUGIN: ${{ inputs.plugin }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          task=publishPlugins
          if [[ "$PLUGIN" != "all" ]]; then
            task=":$PLUGIN:publishPlugins"
          fi
          ./gradlew "$task" --stacktrace -Pversion="${VERSION#v}"
