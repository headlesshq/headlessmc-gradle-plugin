name: Github pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew dokkaGeneratePublicationHtml --stacktrace

      - name: Copy the documentation
        run: |
          mkdir -p _site
          cp -r headlessmc-gradle-plugin/build/dokka/html _site/headlessmc-gradle-plugin
          cp -r headlessmc-dev-plugin/build/dokka/html _site/headlessmc-dev-plugin

      - name: Upload Web page artifact
        uses: actions/upload-pages-artifact@v3.0.1

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .
      - name: Display structure of downloaded files
        run: ls -R
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
