org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.caching=true

group=io.github.headlesshq
# x-release-please-start-version
version=1.0.0
# x-release-please-end
# The HeadlessMc version the plugins use by default
headlessmc_version=3.0.0-RC9
# The HeadlessMc the headlessmc-dev-plugin uses by default, 3.0.0-RC9 is the first version supporting plugins.
# This can be a SNAPSHOT of an unreleased HeadlessMc, e.g. a local build or an included build (headlessmc.includedBuild).
dev_plugin_headlessmc_group=io.github.headlesshq
dev_plugin_headlessmc_version=3.0.0-RC9
# The HeadlessMc versions plugins built against the default HeadlessMc are compatible with
dev_plugin_headlessmc_compatible=[3.0.0-RC9,4)

# Gradle provides the Kotlin standard library to plugins
kotlin.stdlib.default.dependency=false
