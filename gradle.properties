org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.caching=true

group=io.github.headlesshq
version=1.0.0
# The HeadlessMc version the plugins use by default
headlessmc_version=3.0.0-RC8
# The HeadlessMc the plugin-dev plugin (hmc-plugin-gradle-plugin) uses by default. Plugins need HeadlessMc 3.0.0-RC9,
# until it is released, use a local build of the feat/plugins branch, e.g. as included build (headlessmc.includedBuild)
hmc_plugin_headlessmc_group=io.github.headlesshq
hmc_plugin_headlessmc_version=3.0.0-RC9-SNAPSHOT
# The HeadlessMc versions plugins built against the default HeadlessMc are compatible with
hmc_plugin_headlessmc_compatible=[3.0.0-RC9,4)
